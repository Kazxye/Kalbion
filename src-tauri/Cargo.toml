[package]
name = "kalbion"
version = "0.1.0"
description = "Local desktop companion for Albion Online"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
kalbion-core = { path = "../crates/kalbion-core" }
kalbion-capture = { path = "../crates/kalbion-capture" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
rfd = "0.15"

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
