[package]
name = "kalbion-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
csv = "1"
thiserror = "2"
tracing = "0.1"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"
